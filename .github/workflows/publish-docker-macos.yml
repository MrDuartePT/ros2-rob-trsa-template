# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image (macos)

on:
  push:
    branches: [ humble ]
  schedule:
    - cron: '0 0 * * 0'
  release:
    types: [ humble ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-24.04-arm
    env:
      ROS_DISTRO: ${{ github.ref_name }} # allow to run in other branches
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set MACOS_BUILD environment variable
        run: echo "MACOS_BUILD=true" >> $GITHUB_ENV

      #- name: Create cache file
      #  run: |
      #    mkdir check-SHA
      #    echo ${{ github.sha }} > github-sha.txt

      #- name: Check SHA
      #  id: check_sha
      #  uses: actions/cache@v1
      #  with:
      #    path: check-SHA
      #    key: check-SHA-${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: |
            mrduartept/ros2-rob-trsa-template
            ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6.10.0
        #if: steps.check_sha.outputs.cache-hit != 'true'
        with:
          context: .
          push: true
          tags: |
            mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-macos
            ghcr.io/mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-macos
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
