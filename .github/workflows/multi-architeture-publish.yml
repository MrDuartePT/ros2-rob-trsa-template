name: Create Multi-Architecture Manifest

on:
  workflow_run:
    workflows:
      - Publish Docker image (amd64)
      - Publish Docker image (arm64)
    types:
      - completed
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

jobs:
  create_manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    env:
      ROS_DISTRO: ${{ github.ref_name }} # allow to run in other branches
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Create and push manifest
        run: |
          docker buildx create --use
          docker buildx imagetools create --tag mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }} \
            mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-amd64 \
            mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-arm64
          docker buildx imagetools create --tag ghcr.io/mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }} \
            ghcr.io/mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-amd64 \
            ghcr.io/mrduartept/ros2-rob-trsa-template:${{ env.ROS_DISTRO }}-arm64
