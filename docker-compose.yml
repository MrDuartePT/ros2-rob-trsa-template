version: '3.9'

volumes:
  # Store VS Code extensions in named volume to prevent re-downloads.
  # See: https://code.visualstudio.com/remote/advancedcontainers/avoid-extension-reinstalls
  # Also see: https://github.com/microsoft/vscode-remote-release/issues/7690
  vscode-extensions: # Store pip wheel cache in named volume to prevent re-downloads.

  pip-whl-cache:


services:
  dev:
    ## Github
    image: 'ghcr.io/mrduartept/ros2-rob-trsa-template:jazzy'
    #image: 'ghcr.io/mrduartept/ros2-rob-trsa-template:jazzy-macos'
    ## Docker Hub
    #image: 'mrduartept/ros2-rob-trsa-template:jazzy'
    #image: 'mrduartept/ros2-rob-trsa-template:jazzy-macos'
    # Can be build locally if prefered
    #build:
    #  context: .
    #  dockerfile: Dockerfile

    devices:
      - "/dev/fuse:/dev/fuse"
      # For AMD/Intel GPU
      #- /dev/kfd 
      #- /dev/dri

    # Cgroup rules to access devices (input devices, cameras, serial. Disable by default)
    #device_cgroup_rules:
      #- 'c 13:* rmw'
      #- 'c 189:* rmw'
      #- 'c 81:* rmw'
      #- 'c 166:* rmw' # For serial devices

    volumes:
      # MacOS users remove this two lines (work on linux/WSL2)
      # `xhost local:+vscode` might need to be run in linux/WSL2 terminal
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # Linux
      #- /mnt/host/wslg/.X11-unix:/tmp/.X11-unix:rw # WSL2
      # Store VS Code extensions in named volume to prevent re-downloads.
      - vscode-extensions:/root/.vscode-server
      # Store pip wheel cache in named volume to prevent re-downloads.
      - pip-whl-cache:/root/.cache/pip
      # Allow access to Docker daemon for VS Code Docker extension to work inside container.
      - /var/run/docker.sock:/var/run/docker.sock

      # Allow access to devices (input devices, cameras, serial. Disable by default)
      #- /dev/input:/dev/input
      #- /dev/bus/usb:/dev/bus/usb
      #- /dev:/dev # For serial devices
      #- /dev/video0:/dev/video0
      #- /dev/video1:/dev/video1

      # For working vulkan driver inside the container on Linux
      #- /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:r

      # Mount point for `./rob_ws` and `./trsa_ws` folder.
      ## Linux/MacOs Mount
      - $HOME/Documents/FCT/Ros2/rob_ws:/home/vscode/rob_ws
      - $HOME/Documents/FCT/Ros2/trsa_ws:/home/vscode/trsa_ws
      - $HOME/Documents/FCT/Ros2/.gazebo-cache:/home/vscode/.gazebo
      - $HOME/Documents/FCT/Ros2/.ignition-cache:/home/vscode/.ignition
      ## Windows Mount
      #- '$USERPROFILE\Documents\FCT\Ros2\rob_ws:/home/vscode/rob_ws'
      #- '$USERPROFILE\Documents\FCT\Ros2\trsa_ws:/home/vscode/trsa_ws'
      #- '$USERPROFILE\Documents\FCT\Ros2\.gazebo-cache:/home/vscode/.gazebo'
      #- '$USERPROFILE\Documents\FCT\Ros2\.ignition-cache:/home/vscode/.ignition'

      # User Defined Mount Points
      #- $HOME/Documents/FCT/Ros2/so101_ws:/home/vscode/so101_ws

    # Better process handling by using a process management system (tini).
    init: true
    # Larger shared memory for VNC & ROS.
    shm_size: 1gb

    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

    # Used to allow ROS to communicate across containers.
    ipc: service:donor
    pid: service:donor

    # Isolate ROS nodes into their own network.
    network_mode: service:donor

    # Override default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
    # MacOS users comment out this two lines (work on linux/WSL2)
    environment:
    - DISPLAY=$DISPLAY
    # (Optinal) Request for nvidia GPU access.
    #- NVIDIA_VISIBLE_DEVICES=all
    #- NVIDIA_DRIVER_CAPABILITIES=all
    #- __NV_PRIME_RENDER_OFFLOAD=1
    #- __GLX_VENDOR_LIBRARY_NAME=nvidia
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

    # Example of setup for ROS to be able to communicate across containers.
    # Is unnecessary if using a single container.

  # IsaacLab/IsaacSim container, only work on linux machine for windows read the documentation
  # isaac-lab:
  #   #image: nvcr.io/nvidia/isaac-sim:5.1.0 # For isaacsim
  #   image: nvcr.io/nvidia/isaac-lab:2.3.2
  #   container_name: isaac-lab
  #   entrypoint: bash
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - PRIVACY_CONSENT=Y
  #     - DISPLAY=$DISPLAY
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - NVIDIA_DRIVER_CAPABILITIES=all
  #     - __NV_PRIME_RENDER_OFFLOAD=1
  #     - __GLX_VENDOR_LIBRARY_NAME=nvidia
  #   runtime: nvidia
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   volumes:
  #     - /tmp/.X11-unix:/tmp/.X11-unix:rw
  #     - $HOME/.Xauthority:/isaac-sim/.Xauthority
  #     - $HOME/docker/isaac-sim/cache/kit:/isaac-sim/kit/cache:rw
  #     - $HOME/docker/isaac-sim/cache/ov:/root/.cache/ov:rw
  #     - $HOME/docker/isaac-sim/cache/pip:/root/.cache/pip:rw
  #     - $HOME/docker/isaac-sim/cache/glcache:/root/.cache/nvidia/GLCache:rw
  #     - $HOME/docker/isaac-sim/cache/computecache:/root/.nv/ComputeCache:rw
  #     - $HOME/docker/isaac-sim/logs:/root/.nvidia-omniverse/logs:rw
  #     - $HOME/docker/isaac-sim/data:/root/.local/share/ov/data:rw
  #     - $HOME/docker/isaac-sim/documents:/root/Documents:rw
  #   # User Defined Mount Points
  #     - $HOME/Documents/FCT/Ros2/so101_ws:/workspace/so101_ws
  #   stdin_open: true
  #   tty: true
  #   restart: "no"

  #   # Used to allow ROS to communicate across containers.
  #   ipc: service:donor
  #   pid: service:donor

  #   # Isolate ROS nodes into their own network.
  #   network_mode: service:donor

  donor:
    ports:
      # Expose noVNC web app.
      - 6080:6080
      # Expose rosbridge.
      - 9090:9090

    # Used to allow ROS to communicate across containers.
    ipc: shareable

    image: alpine # smallest image
    stop_signal: SIGKILL
    command: sleep infinity
